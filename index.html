<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumHelix.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B1026;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .helix-image {
            width: clamp(200px, 40vw, 420px);
            height: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #19E0FF 0%, #6C63FF 50%, #C46BFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.75rem, 1.5vw, 1rem);
            color: #8A92A0;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #19E0FF, #6C63FF);
            margin: 0 auto 2.5rem;
        }

        .status {
            font-size: 0.9rem;
            color: #555;
            letter-spacing: 0.05em;
        }

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.12;
            pointer-events: none;
        }

        .glow-1 {
            background: #6C63FF;
            top: -150px;
            right: -150px;
        }

        .glow-2 {
            background: #19E0FF;
            bottom: -150px;
            left: -150px;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="container">
        <img src="QuantumHelix_helix.webp" alt="QuantumHelix DNA Helix" class="helix-image">
        <h1>QuantumHelix.ai</h1>
        <p class="tagline">Something New Is Coming</p>
        <div class="divider"></div>
        <p class="status">We're building something extraordinary. Stay tuned.</p>
    </div>
</body>
</html>
