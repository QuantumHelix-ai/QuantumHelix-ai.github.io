<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumHelix.ai</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .helix-strand {
            width: clamp(260px, 45vw, 480px);
            height: auto;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff2d95);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #888;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            margin: 0 auto 2.5rem;
        }

        .status {
            font-size: 0.95rem;
            color: #555;
            letter-spacing: 0.05em;
        }

        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }

        .glow-1 {
            background: #7b2ff7;
            top: -100px;
            right: -100px;
        }

        .glow-2 {
            background: #00d4ff;
            bottom: -100px;
            left: -100px;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="container">
        <img src="QuantumHelix_helix_strand.webp" alt="QuantumHelix DNA Helix" class="helix-strand">
        <h1>QuantumHelix.ai</h1>
        <p class="tagline">Something new is coming</p>
        <div class="divider"></div>
        <p class="status">We're building something extraordinary. Stay tuned.</p>
    </div>
</body>
</html>
