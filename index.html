<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumHelix.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B1026;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .helix-logo {
            width: clamp(180px, 40vw, 320px);
            height: auto;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #19E0FF, #6C63FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.85rem, 1.8vw, 1.1rem);
            color: #B0B8C4;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #19E0FF, #6C63FF);
            margin: 0 auto 2.5rem;
        }

        .status {
            font-size: 0.95rem;
            color: #555;
            letter-spacing: 0.05em;
        }

        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }

        .glow-1 {
            background: #6C63FF;
            top: -100px;
            right: -100px;
        }

        .glow-2 {
            background: #19E0FF;
            bottom: -100px;
            left: -100px;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="container">
        <svg class="helix-logo" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="helixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#19E0FF"/>
                    <stop offset="50%" stop-color="#4A8EFF"/>
                    <stop offset="100%" stop-color="#6C63FF"/>
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <!-- Top strand -->
            <path d="M30,60 C60,15 100,15 140,60 C180,105 220,105 260,60 C300,15 340,15 370,60"
                  fill="none" stroke="url(#helixGrad)" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Bottom strand -->
            <path d="M30,60 C60,105 100,105 140,60 C180,15 220,15 260,60 C300,105 340,105 370,60"
                  fill="none" stroke="url(#helixGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
            <!-- Rungs -->
            <line x1="68" y1="38" x2="68" y2="82" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.4"/>
            <line x1="85" y1="28" x2="85" y2="92" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.35"/>
            <line x1="105" y1="22" x2="105" y2="98" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.3"/>
            <line x1="122" y1="28" x2="122" y2="92" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.35"/>
            <line x1="140" y1="45" x2="140" y2="75" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.4"/>
            <line x1="165" y1="82" x2="165" y2="38" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.35"/>
            <line x1="185" y1="92" x2="185" y2="28" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.3"/>
            <line x1="200" y1="98" x2="200" y2="22" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.3"/>
            <line x1="218" y1="92" x2="218" y2="28" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.35"/>
            <line x1="235" y1="82" x2="235" y2="38" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.4"/>
            <line x1="260" y1="45" x2="260" y2="75" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.4"/>
            <line x1="278" y1="28" x2="278" y2="92" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.35"/>
            <line x1="295" y1="22" x2="295" y2="98" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.3"/>
            <line x1="315" y1="28" x2="315" y2="92" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.35"/>
            <line x1="332" y1="38" x2="332" y2="82" stroke="url(#helixGrad)" stroke-width="1.5" opacity="0.4"/>
            <!-- Glowing dots at intersections -->
            <circle cx="140" cy="60" r="4" fill="#19E0FF" filter="url(#glow)" opacity="0.9"/>
            <circle cx="260" cy="60" r="4" fill="#4A8EFF" filter="url(#glow)" opacity="0.9"/>
            <circle cx="200" cy="60" r="3" fill="#6C63FF" filter="url(#glow)" opacity="0.8"/>
            <!-- Dots along top strand -->
            <circle cx="85" cy="26" r="2.5" fill="#19E0FF" filter="url(#glow)" opacity="0.7"/>
            <circle cx="185" cy="94" r="2.5" fill="#3A78FF" filter="url(#glow)" opacity="0.7"/>
            <circle cx="295" cy="20" r="2.5" fill="#5C5BFF" filter="url(#glow)" opacity="0.7"/>
            <!-- Dots along bottom strand -->
            <circle cx="105" cy="98" r="2" fill="#25CCFF" filter="url(#glow)" opacity="0.6"/>
            <circle cx="218" cy="26" r="2" fill="#4A8EFF" filter="url(#glow)" opacity="0.6"/>
            <circle cx="315" cy="94" r="2" fill="#6C63FF" filter="url(#glow)" opacity="0.6"/>
        </svg>
        <h1>QuantumHelix.ai</h1>
        <p class="tagline">Structured Intelligence at Quantum Scale</p>
        <div class="divider"></div>
        <p class="status">We're building something extraordinary. Stay tuned.</p>
    </div>
</body>
</html>
